[project]
name = "document-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.85",
    "celery>=5.6.3",
    "docling>=2.124.0",
    "onnxruntime>=1.29.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.5",
]
